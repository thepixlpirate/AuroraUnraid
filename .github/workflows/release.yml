name: Release Unraid Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2026.10.30.0200)'
        required: true
        default: 'v2026.10.30.0200'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          CLEAN_VERSION=${VERSION#v}
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Plugin Manifest & Archive
        run: |
          mkdir -p build
          tar -cJf build/Aurora-Theme.txz -C plugin .
          cp Aurora-Theme.plg build/Aurora-Theme.plg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/Aurora-Theme.plg
            build/Aurora-Theme.txz
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
