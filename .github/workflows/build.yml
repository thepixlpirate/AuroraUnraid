name: Build Aurora Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the action can push the .plg file back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python plugin/build.py

      - name: Commit and push compiled plugin
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: compile AuroraUnraid.plg [skip ci]"
          file_pattern: "*.plg"
